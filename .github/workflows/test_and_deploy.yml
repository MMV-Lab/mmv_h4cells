# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: tests

on:
  push:
    branches:
      - main
      - master
      - npe2
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - main
      - master
      - npe2
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.platform }}
    # experimental jobs show their result without failing the workflow
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      # a failing platform must not hide the results of the others
      fail-fast: false
      matrix:
        # ubuntu-24.04 instead of ubuntu-latest: the label is moving to
        # Ubuntu 26.04, where installing the system libraries fails (apt
        # exit codes 100 and 124). Switch back once that works.
        platform: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
        include:
          # find out if the tests run on the new Ubuntu
          - platform: ubuntu-26.04
            python-version: '3.13'
            experimental: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The default Ubuntu mirror of the runners (azure.archive.ubuntu.com)
      # could not be resolved, so apt-get hung and timed out. Use the main
      # Ubuntu mirror instead; the file is the list of mirrors apt reads.
      - name: Use the main Ubuntu mirror
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt || true
          cat /etc/apt/apt-mirrors.txt || true

      # the libraries Qt needs and a virtual display on linux
      - uses: pyvista/setup-headless-display-action@v5
        if: runner.os == 'Linux'
        with:
          qt: true
          pyvista: false

      # strategy borrowed from vispy for installing opengl libs on windows
      - name: Install Windows OpenGL
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 https://github.com/pyvista/gl-ci-helpers.git
          powershell gl-ci-helpers/appveyor/install_opengl.ps1

      # note: if you need dependencies from conda, considering using
      # setup-miniconda: https://github.com/conda-incubator/setup-miniconda
      # and
      # tox-conda: https://github.com/tox-dev/tox-conda
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools tox tox-gh-actions

      # this runs the platform-specific tests declared in tox.ini
      - name: Test with tox
        uses: aganders3/headless-gui@v2
        with:
          run: python -m tox
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          # uploads need a token: add CODECOV_TOKEN to the repository secrets
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  deploy:
    # this will run when you have tagged a commit, starting with "v*"
    # and requires that you have put your twine API key in your
    # github secrets (see readme for details)
    needs: [test]
    runs-on: ubuntu-latest
    if: contains(github.ref, 'tags')
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel build
          # pip install -U setuptools setuptools_scm wheel twine build
      - name: Build Package
        run: python -m build .
      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
        # env:
        #   TWINE_USERNAME: __token__
        #   TWINE_PASSWORD: ${{ secrets.TWINE_API_KEY }}
        # run: |
        #   git tag
        #   python -m build .
        #   twine upload dist/*
